name: Build and test
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: taskpane-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: swift --version
      - name: Test
        run: bash scripts/test.sh
      - name: Build
        run: bash scripts/build.sh release
